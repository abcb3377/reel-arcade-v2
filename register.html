<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REEL ARCADE - REGISTER</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090909;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      main {
        width: min(500px, 100%);
        padding: 30px;
        background: #171717;
        border: 1px solid #444;
        border-radius: 16px;
        text-align: center;
      }

      h1 {
        letter-spacing: 3px;
      }

      #status {
        margin: 24px 0;
      }

      #userId {
        display: block;
        overflow-wrap: anywhere;
        padding: 14px;
        background: #090909;
        border-radius: 8px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        background: #287b50;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>REEL ARCADE</h1>
      <h2>DEVICE REGISTER</h2>
      <p id="status">接続中...</p>
      <p>DEVICE ID</p>
      <code id="userId">---</code>
      <button id="copyButton" disabled>IDをコピー</button>
    </main>

    <script type="module" src="./register.js"></script>
  </body>
</html>
